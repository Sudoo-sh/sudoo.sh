name: Feature request
description: Suggest a new feature or a change of behaviour.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the solution you have in mind. Wait for a reply before writing code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How the panel could behave. Screens, buttons or settings you imagine are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: who
    attributes:
      label: Who benefits
      multiple: true
      options:
        - Super admins and administrators
        - Maintainers and developers
        - Developers pushing code
        - People using the instances
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to build this myself, following CONTRIBUTING.md.
