# Keeps the CI actions, the base images, the Python dependencies (uv.lock) and the web app's packages up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: web
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
