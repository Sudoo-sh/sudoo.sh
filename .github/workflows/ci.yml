name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pre-commit checks (black, ruff, mypy, shellcheck, uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the project and its development tools
        run: uv sync --frozen
      - name: Run every pre-commit hook on every file
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copy documentation into the build context
        # The image serves README.md and docs/ inside the panel; install.sh places them in documentation/.
        run: mkdir documentation && cp -r README.md docs documentation/
      - name: Build
        run: docker build --tag sudoo:ci .
