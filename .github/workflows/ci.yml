name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pre-commit checks (black, ruff, mypy, shellcheck, uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install the project and its development tools
        run: uv sync --frozen
      - name: Run every pre-commit hook on every file
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the panel's image (the documentation is copied in by the Dockerfile)
        run: docker build --tag sudoo:ci .
      - name: The image serves the documentation
        run: docker run --rm --entrypoint sh sudoo:ci -c 'test -f /app/documentation/README.md && test -f /app/documentation/docs/ADMIN_GUIDE.md'
      - name: Build the web app's image
        run: docker build --tag sudoo-web:ci web

  web:
    name: Web app (TypeScript, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Build the demo (README, Demo build)
        run: npm run build:demo
      - name: The normal build contains no demo code
        run: |
          if grep -rlE 'example-integrator|demo-bar|sudoo\.demo' dist/; then
            echo "::error::Demo code found in the normal build (dist/)"; exit 1
          fi
          test -f dist-demo/_headers && test -f dist-demo/_redirects

  edge:
    name: Publish the edge images (main)
    # every push to main that passes the checks: ghcr.io/sudoo-sh/sudoo-{panel,web}:edge and :sha-<short commit>,
    # for servers that follow main (sudoo-install update --version edge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, tests, docker, web]
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      tags: |
        type=edge,branch=main
        type=sha,prefix=sha-,format=short

  # The demo (demo.sudoo.sh) by direct upload to Cloudflare Pages. Set the variable PAGES_DIRECT_UPLOAD to "true" and
  # the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to turn it on; otherwise the job ends with a notice.
  # Runs on pushes to main only; pull requests never deploy. A Pages project connected to the repository (README, Demo
  # build) needs none of this.
  demo:
    name: Deploy the demo to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    env:
      PAGES_DIRECT_UPLOAD: ${{ vars.PAGES_DIRECT_UPLOAD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that direct upload is on and configured
        id: gate
        run: |
          if [ "$PAGES_DIRECT_UPLOAD" != "true" ]; then
            echo "::notice::Direct upload to Cloudflare Pages is off (variable PAGES_DIRECT_UPLOAD is not \"true\"); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Cloudflare Pages deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the demo
        if: steps.gate.outputs.enabled == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build:demo
      - name: Prepare a folder for Wrangler
        if: steps.gate.outputs.enabled == 'true'
        run: mkdir -p .wrangler-deploy && echo '{"private":true}' > .wrangler-deploy/package.json
      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          packageManager: npm
          workingDirectory: .wrangler-deploy
          command: pages deploy ../web/dist-demo --project-name=sudoo-demo --branch=main
