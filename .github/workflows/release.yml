name: Release

# Pushing a tag v1.2.3 (or v1.2.3-rc.1) publishes the two images for linux/amd64 and linux/arm64, signed, then builds
# the installer and creates a draft GitHub release with:
#
#   sudoo-install.sh (+ .sigstore.json)   the installer, built from Sudoo-sh/sudoo-installer at INSTALLER_REF
#   compose.yaml (+ .sigstore.json)       pinned to the images' digests, for manual installs
#   env.example, SHA256SUMS
#
# Both bundles are keyless Sigstore signatures made by this workflow, so the certificate names exactly
#   https://github.com/Sudoo-sh/sudoo.sh/.github/workflows/release.yml@refs/tags/<tag>
# with the issuer https://token.actions.githubusercontent.com: the identity the installer pins when it hands an update
# off to a release's installer (docs/SECURITY.md, section 13). No maintainer login signs anything.
#
# The installer's source is the private repository Sudoo-sh/sudoo-installer, checked out read-only with the deploy key
# in the secret SUDOO_INSTALLER_DEPLOY_KEY at the full commit INSTALLER_REF (a commit cannot move, a tag could): change
# it in a reviewed pull request to release a newer installer. Without the secret the release stops before anything is
# signed or published.
#
# Jobs and their permissions: only "sign" can request an OIDC token, only "release" can write to the repository, and
# the job that holds the deploy key and runs the installer's tests can do neither. A maintainer checks the draft
# (sudoo-installer's publish-release.sh) and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Sudoo-sh/sudoo-installer, main after Sudoo-sh/sudoo-installer#6
  INSTALLER_REF: 2c6db116dd0856722dc2cad1244311ce10c33cdf

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: The tag must be a version, equal to pyproject.toml's
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag (v1.2.3 or v1.2.3-rc.1)"; exit 1
          fi
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)
          if [ "$project" != "$version" ]; then
            echo "::error::pyproject.toml says $project, the tag says $version: set the version, then tag again"; exit 1
          fi
          if ! [[ "$INSTALLER_REF" =~ ^[0-9a-f]{40}$ ]] || [ "$INSTALLER_REF" = 0000000000000000000000000000000000000000 ]; then
            echo "::error::INSTALLER_REF in release.yml must be a full commit of Sudoo-sh/sudoo-installer"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "stable=false" >> "$GITHUB_OUTPUT"; else echo "stable=true" >> "$GITHUB_OUTPUT"; fi

  images:
    name: Images
    needs: version
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      # 1.2.3 always; 1.2, 1 and latest for stable versions only
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.stable }}
        type=semver,pattern={{major}},enable=${{ needs.version.outputs.stable }}
        type=raw,value=latest,enable=${{ needs.version.outputs.stable }}

  installer:
    name: Installer and release files
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PANEL: ghcr.io/sudoo-sh/sudoo-panel@${{ needs.images.outputs.panel-digest }}
      WEB: ghcr.io/sudoo-sh/sudoo-web@${{ needs.images.outputs.web-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose.yaml pinned to the digests, without the build lines
        run: |
          mkdir dist
          sed -E \
            -e "s#^(    image: )\\$\\{SUDOO_PANEL_IMAGE:-[^}]*\\}\$#\\1$PANEL#" \
            -e "s#^(    image: )\\$\\{SUDOO_WEB_IMAGE:-[^}]*\\}\$#\\1$WEB#" \
            -e '/^    build: /d' compose.yaml > dist/compose.yaml
          # four services: manager, gateway and mail on the panel's image (one digest), web on the web image
          [ "$(grep -c '^    image: ghcr.io/sudoo-sh/sudoo-[a-z]*@sha256:[0-9a-f]\{64\}$' dist/compose.yaml)" = 4 ]
          [ "$(grep -cxF "    image: $PANEL" dist/compose.yaml)" = 3 ]
          [ "$(grep -cxF "    image: $WEB" dist/compose.yaml)" = 1 ]
          grep -qx '    container_name: sudoo-mail' dist/compose.yaml
          if grep -q '^    build:' dist/compose.yaml; then exit 1; fi
          cp .env.example dist/env.example
          (cd dist && cp env.example .env && docker compose config --quiet && rm .env)
          cat dist/compose.yaml
      - name: Sudoo-sh/sudoo-installer at INSTALLER_REF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sudoo-sh/sudoo-installer
          ref: ${{ env.INSTALLER_REF }}
          ssh-key: ${{ secrets.SUDOO_INSTALLER_DEPLOY_KEY }}
          path: installer
          persist-credentials: false
      - name: The installer's source is exactly INSTALLER_REF
        run: |
          [ "$(git -C installer rev-parse HEAD)" = "$INSTALLER_REF" ]
      - name: The installer's shellcheck and bats tests
        run: |
          docker build -q -t sudoo-installer-tests installer/tests
          docker run --rm -v "$PWD/installer:/src:ro" -e TERM=dumb sudoo-installer-tests tests/run.sh
      - name: Build sudoo-install.sh
        run: |
          installer/build.sh "$VERSION" dist/compose.yaml dist/env.example LICENSE.md > dist/sudoo-install.sh
          grep -qx "SUDOO_RELEASE=\"$VERSION\"" dist/sudoo-install.sh
          grep -qx "SUDOO_LICENCE_SHA256=\"$(sha256sum LICENSE.md | cut -d' ' -f1)\"" dist/sudoo-install.sh
          [ "$(grep -cxF "    image: $PANEL" dist/sudoo-install.sh)" = 3 ]
          grep -qxF "    image: $WEB" dist/sudoo-install.sh
          docker run --rm -v "$PWD/dist:/dist:ro" sudoo-installer-tests shellcheck /dist/sudoo-install.sh
      - name: Both images exist for linux/amd64 and linux/arm64
        run: |
          for ref in "$PANEL" "$WEB"; do
            platforms=$(docker buildx imagetools inspect "$ref" | awk '/Platform:/ { print $2 }' | sort -u | tr '\n' ' ')
            echo "${ref%%@*}: $platforms"
            [[ "$platforms" == *linux/amd64* && "$platforms" == *linux/arm64* ]]
          done
      - name: Dry run of the installer against a temporary root
        run: |
          root="$RUNNER_TEMP/root"
          mkdir -p "$root"
          bash dist/sudoo-install.sh install --dry-run --force --yes --accept-licence --no-color --root-dir "$root" </dev/null | tee dry-run.log
          grep -qF "$PANEL" dry-run.log
          grep -qF "$WEB" dry-run.log
          grep -qF "image: $PANEL" "$root/opt/odoo/manager/compose.yaml"
          grep -qx '    container_name: sudoo-mail' "$root/opt/odoo/manager/compose.yaml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/sudoo-install.sh
            dist/compose.yaml
            dist/env.example
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign (keyless)
    needs: [version, installer]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # keyless signing (Sigstore); nothing else
    env:
      IDENTITY: https://github.com/Sudoo-sh/sudoo.sh/.github/workflows/release.yml@refs/tags/v${{ needs.version.outputs.version }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign sudoo-install.sh and compose.yaml, verify both for the identity the installer pins
        working-directory: dist
        run: |
          [ "$GITHUB_REF" = "${IDENTITY##*@}" ]
          for f in sudoo-install.sh compose.yaml; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$f"
          done
          sha256sum sudoo-install.sh sudoo-install.sh.sigstore.json compose.yaml compose.yaml.sigstore.json env.example > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Draft release
    needs: [version, images, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PANEL: ghcr.io/sudoo-sh/sudoo-panel@${{ needs.images.outputs.panel-digest }}
      WEB: ghcr.io/sudoo-sh/sudoo-web@${{ needs.images.outputs.web-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-files
          path: dist
      - name: Every file is there and matches SHA256SUMS
        working-directory: dist
        run: |
          for f in sudoo-install.sh sudoo-install.sh.sigstore.json compose.yaml compose.yaml.sigstore.json env.example; do
            grep -qE "^[0-9a-f]{64}  $f\$" SHA256SUMS
          done
          sha256sum --check SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; if (index($0, "[" v "]")) { on = 1; next } }
            on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat >> notes.md <<EOF

          ## Install or update

          \`\`\`bash
          curl -fsSL https://github.com/Sudoo-sh/sudoo.sh/releases/latest/download/sudoo-install.sh | sudo bash
          \`\`\`

          \`sudoo-install.sh\` and \`compose.yaml\` are signed by this release's workflow
          (\`https://github.com/Sudoo-sh/sudoo.sh/.github/workflows/release.yml@refs/tags/v$VERSION\`); how to check them:
          docs/SECURITY.md. Manual installation with compose.yaml: docs/ADMIN_GUIDE.md. Images (signed with Sigstore):

          - \`$PANEL\`
          - \`$WEB\`
          EOF
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ needs.version.outputs.stable }}
        run: |
          flags=(--draft)
          [ "$STABLE" = true ] || flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Sudoo.sh $VERSION" --notes-file notes.md "${flags[@]}" \
            dist/sudoo-install.sh dist/sudoo-install.sh.sigstore.json dist/compose.yaml dist/compose.yaml.sigstore.json \
            dist/env.example dist/SHA256SUMS
