# Sudoo.sh: the backend (sudoo-panel), the gateway service (sudoo-gateway) and the web app (sudoo-web). Instances
# (odoo-*) and Cloudflare connectors (sudoo-connector-*) are separate containers that the backend manages: they are
# not part of this project, and recreating these services never touches them.
#
# Each release attaches this file as compose.yaml with the images pinned by digest and without the build lines; that
# is the file a server uses (docs/ADMIN_GUIDE.md). In a clone of the repository, `docker compose build` builds the
# two images locally as sudoo-panel:local and sudoo-web:local (README, "From source").
name: sudoo-panel

services:
  manager:
    image: ${SUDOO_PANEL_IMAGE:-sudoo-panel:local}
    build: .
    container_name: sudoo-panel
    restart: unless-stopped
    # a small init process as PID 1: collects processes started with `docker exec`, so gunicorn does not
    # mistake them for its own workers, and passes stop signals on
    init: true
    env_file: .env
    # host networking: the panel, the gateway ports and the connectors share the server's network
    network_mode: host
    volumes:
      # the panel runs docker and docker compose against the host's Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # same path as on the host, so paths in the instances' compose files mean the same inside and outside
      - /opt/odoo:/opt/odoo
      # the host's machine id, read-only, for the marketplace's hardware fingerprint (docs/MARKETPLACE.md); the long
      # form never creates the file on the host: a host without /etc/machine-id runs `systemd-machine-id-setup`
      - type: bind
        source: /etc/machine-id
        target: /host/etc/machine-id
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT:-9002}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  gateway:
    # every instance's gateway port (GATEWAY_MODE=service, the default): visitors keep reaching the instances while
    # the panel restarts or is down. Same image as the backend, without the Docker socket, without .env and without
    # the panel's data: it reads and writes only /opt/odoo/gateway, where the backend hands it the instances and
    # their settings (docs/concepts/GATEWAY.md). While it is not running, the backend serves the instances itself.
    image: ${SUDOO_PANEL_IMAGE:-sudoo-panel:local}
    container_name: sudoo-gateway
    command: ["sudoo.sh", "gateway"]
    restart: unless-stopped
    init: true
    # host networking: the gateway ports are where the connectors (or visitors, with host-ports) expect them, and
    # custom domains are answered on the server's ports 80 and 443
    network_mode: host
    volumes:
      - /opt/odoo/gateway:/opt/odoo/gateway
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # only to open ports below 1024: 80 and 443 for custom domains (CUSTOM_DOMAINS=acme, docs/ADMIN_GUIDE.md)
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # on a normal stop it gives the panel 3 seconds to take the ports over before it closes them
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-m", "sudoo.instances.gateway_health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mail:
    # the mail catcher (`sudoo.sh mailcatcher`, docs/ADMIN_GUIDE.md "Mail catcher"): staging and development instances
    # send their e-mail here and nothing goes out. Same image as the backend, without the Docker socket, without .env
    # and without a published port: it reads and writes only /opt/odoo/mail, where the backend hands it the
    # instances' mailboxes and reads the caught e-mails back. The backend connects it to each staging and
    # development instance's own network; its own network has no way out.
    image: ${SUDOO_PANEL_IMAGE:-sudoo-panel:local}
    container_name: sudoo-mail
    command: ["sudoo.sh", "mailcatcher"]
    restart: unless-stopped
    init: true
    networks:
      - mail
    volumes:
      - /opt/odoo/mail:/opt/odoo/mail
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "sudoo.sh", "mailcatcher", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    # the web app (web/): the React front end, served by Caddy, which forwards /api, /hooks and /docs to the
    # backend on 127.0.0.1:API_PORT and the live events to 127.0.0.1:EVENTS_PORT
    image: ${SUDOO_WEB_IMAGE:-sudoo-web:local}
    build: ./web
    container_name: sudoo-web
    restart: unless-stopped
    network_mode: host
    # only what the web service needs, never the secrets in .env (values come from .env when Compose starts it)
    environment:
      EXPOSURE: ${EXPOSURE:-cloudflare-quick}
      PANEL_PORT: ${PANEL_PORT:-9000}
      API_PORT: ${API_PORT:-9002}
      EVENTS_PORT: ${EVENTS_PORT:-9001}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PANEL_PORT:-9000}/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - manager

networks:
  # the mail catcher's own network: internal, so the catcher has no way out
  mail:
    name: sudoo-mail
    internal: true
