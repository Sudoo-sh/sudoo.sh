<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" width="820" height="590" role="img" aria-label="Code from GitHub"><title>Code from GitHub</title><style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Noto Sans', Arial, sans-serif; fill: #1f2937; }
.t { font-size: 14px; font-weight: 600; }
.s { font-size: 12.5px; }
.m { font-size: 12px; fill: #6b7280; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.lab { font-size: 12px; fill: #4b5563; }
.labbg { fill: #ffffff; }
.arrow { stroke: #6b7280; stroke-width: 1.6; fill: none; }
.arrow.dash { stroke-dasharray: 5 4; }
.arrow.bold { stroke: #017e84; stroke-width: 3; }
.arrow.bad { stroke: #d23f3a; }
.head { fill: #6b7280; }
.head.bold { fill: #017e84; }
.head.bad { fill: #d23f3a; }
.life { stroke: #c4c9d0; stroke-width: 1.2; stroke-dasharray: 4 4; }
.k-default { fill: #ffffff; stroke: #d0d7de; }
.k-outside { fill: #fff8e6; stroke: #d9a521; }
.k-cloud { fill: #e6f2f3; stroke: #017e84; }
.k-panel { fill: #f3edf2; stroke: #714b67; }
.k-instance { fill: #eef2f7; stroke: #8792a2; }
.k-danger { fill: #fdecec; stroke: #d23f3a; }
.k-decision { fill: #fff3cd; stroke: #e99d00; }
.k-ok { fill: #e8f5ec; stroke: #28a745; }
.k-group { fill: none; stroke: #9ca3af; stroke-dasharray: 6 5; }
.k-ui { fill: #f9fafb; stroke: #d0d7de; }
.k-button { fill: #e7e9ed; stroke: #e7e9ed; }
.k-primary { fill: #714b67; stroke: #714b67; }
.k-current { fill: #e6f2f3; stroke: #d0d7de; }
.white { fill: #ffffff; }
.teal { fill: #017e84; }
.bad-text { fill: #d23f3a; font-size: 16px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .bg, .labbg { fill: #1b1f27; }
  text { fill: #e5e7eb; }
  .m { fill: #9ca3af; }
  .lab { fill: #c4c9d0; }
  .arrow { stroke: #9ca3af; } .head { fill: #9ca3af; }
  .arrow.bold { stroke: #3fb6bc; } .head.bold { fill: #3fb6bc; }
  .life { stroke: #4a5060; }
  .k-default { fill: #232834; stroke: #3a3f4d; }
  .k-outside { fill: #3a2f12; stroke: #d9a521; }
  .k-cloud { fill: #12302f; stroke: #3fb6bc; }
  .k-panel { fill: #33222f; stroke: #b58aa8; }
  .k-instance { fill: #222833; stroke: #6b7280; }
  .k-danger { fill: #3b1c1c; stroke: #ef5350; }
  .k-decision { fill: #3a3015; stroke: #f0b429; }
  .k-ok { fill: #17301f; stroke: #4caf50; }
  .k-ui { fill: #232834; stroke: #3a3f4d; }
  .k-button { fill: #3a3f4d; stroke: #3a3f4d; }
  .k-primary { fill: #875a7b; stroke: #875a7b; }
  .k-current { fill: #12302f; stroke: #3a3f4d; }
  .teal { fill: #3fb6bc; }
}
</style><rect class="bg" width="820" height="590" rx="12"/><rect class="k-outside" x="30" y="20" width="230" height="50" rx="8"/><text class="t" x="145.0" y="40.0" text-anchor="middle">Developer pushes</text><text class="s" x="145.0" y="59.0" text-anchor="middle">the panel checks every 2 min</text><rect class="k-outside" x="290" y="20" width="210" height="50" rx="8"/><text class="t" x="395.0" y="40.0" text-anchor="middle">"Get latest code"</text><text class="s" x="395.0" y="59.0" text-anchor="middle">clicked in the panel</text><path class="arrow " d="M145,70 L145,96 L395,96 L395,116"/><path class="head " d="M395,116 L390.5,107.0 L399.5,107.0 Z"/><path class="arrow " d="M395,70 L395,116"/><path class="head " d="M395,116 L390.5,107.0 L399.5,107.0 Z"/><rect class="k-decision" x="250" y="116" width="290" height="46" rx="8"/><text class="s" x="395.0" y="143.5" text-anchor="middle">Does the branch still exist on GitHub?</text><rect class="k-danger" x="580" y="116" width="210" height="46" rx="8"/><text class="s" x="685.0" y="143.5" text-anchor="middle">Stop: "Switch branch"</text><path class="arrow " d="M540,139 L580,139"/><path class="head " d="M580,139 L571.0,143.5 L571.0,134.5 Z"/><rect class="labbg" x="543.3" y="118" width="23.4" height="18" rx="3"/><text class="lab" x="555.0" y="131.0" text-anchor="middle">no</text><path class="arrow " d="M395,162 L395,196"/><path class="head " d="M395,196 L390.5,187.0 L399.5,187.0 Z"/><rect class="labbg" x="407.0" y="171" width="30.2" height="18" rx="3"/><text class="lab" x="412.0" y="184.0" text-anchor="start">yes</text><rect class="k-default" x="270" y="196" width="250" height="46" rx="8"/><text class="s" x="395.0" y="223.5" text-anchor="middle">git pull, git submodule update</text><path class="arrow " d="M395,242 L395,276"/><path class="head " d="M395,276 L390.5,267.0 L399.5,267.0 Z"/><rect class="k-decision" x="270" y="276" width="250" height="46" rx="8"/><text class="s" x="395.0" y="303.5" text-anchor="middle">Anything new?</text><rect class="k-default" x="580" y="276" width="210" height="46" rx="8"/><text class="s" x="685.0" y="303.5" text-anchor="middle">Nothing to do</text><path class="arrow " d="M520,299 L580,299"/><path class="head " d="M580,299 L571.0,303.5 L571.0,294.5 Z"/><rect class="labbg" x="538.3" y="278" width="23.4" height="18" rx="3"/><text class="lab" x="550.0" y="291.0" text-anchor="middle">no</text><path class="arrow " d="M395,322 L395,356"/><path class="head " d="M395,356 L390.5,347.0 L399.5,347.0 Z"/><rect class="labbg" x="407.0" y="331" width="30.2" height="18" rx="3"/><text class="lab" x="412.0" y="344.0" text-anchor="start">yes</text><rect class="k-default" x="240" y="356" width="310" height="46" rx="8"/><text class="s" x="395.0" y="383.5" text-anchor="middle">Which modules have changed files?</text><path class="arrow " d="M395,402 L395,436"/><path class="head " d="M395,436 L390.5,427.0 L399.5,427.0 Z"/><rect class="k-decision" x="220" y="436" width="350" height="46" rx="8"/><text class="s" x="395.0" y="463.5" text-anchor="middle">"Upgrade changed modules" on, and any changed?</text><rect class="k-ok" x="40" y="526" width="300" height="46" rx="8"/><text class="s" x="190.0" y="553.5" text-anchor="middle">Stop Odoo, odoo -u &lt;changed&gt;, start</text><rect class="k-ok" x="470" y="526" width="300" height="46" rx="8"/><text class="s" x="620.0" y="553.5" text-anchor="middle">Restart Odoo</text><path class="arrow " d="M320,482 L320,504 L190,504 L190,526"/><path class="head " d="M190,526 L185.5,517.0 L194.5,517.0 Z"/><rect class="labbg" x="239.9" y="487" width="30.2" height="18" rx="3"/><text class="lab" x="255.0" y="500.0" text-anchor="middle">yes</text><path class="arrow " d="M470,482 L470,504 L620,504 L620,526"/><path class="head " d="M620,526 L615.5,517.0 L624.5,517.0 Z"/><rect class="labbg" x="533.3" y="487" width="23.4" height="18" rx="3"/><text class="lab" x="545.0" y="500.0" text-anchor="middle">no</text></svg>
