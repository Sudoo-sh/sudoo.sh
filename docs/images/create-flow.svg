<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" width="780" height="700" role="img" aria-label="Creating an instance"><title>Creating an instance</title><style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Noto Sans', Arial, sans-serif; fill: #1f2937; }
.t { font-size: 14px; font-weight: 600; }
.s { font-size: 12.5px; }
.m { font-size: 12px; fill: #6b7280; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.lab { font-size: 12px; fill: #4b5563; }
.labbg { fill: #ffffff; }
.arrow { stroke: #6b7280; stroke-width: 1.6; fill: none; }
.arrow.dash { stroke-dasharray: 5 4; }
.arrow.bold { stroke: #017e84; stroke-width: 3; }
.arrow.bad { stroke: #d23f3a; }
.head { fill: #6b7280; }
.head.bold { fill: #017e84; }
.head.bad { fill: #d23f3a; }
.life { stroke: #c4c9d0; stroke-width: 1.2; stroke-dasharray: 4 4; }
.k-default { fill: #ffffff; stroke: #d0d7de; }
.k-outside { fill: #fff8e6; stroke: #d9a521; }
.k-cloud { fill: #e6f2f3; stroke: #017e84; }
.k-panel { fill: #f3edf2; stroke: #714b67; }
.k-instance { fill: #eef2f7; stroke: #8792a2; }
.k-danger { fill: #fdecec; stroke: #d23f3a; }
.k-decision { fill: #fff3cd; stroke: #e99d00; }
.k-ok { fill: #e8f5ec; stroke: #28a745; }
.k-group { fill: none; stroke: #9ca3af; stroke-dasharray: 6 5; }
.k-ui { fill: #f9fafb; stroke: #d0d7de; }
.k-button { fill: #e7e9ed; stroke: #e7e9ed; }
.k-primary { fill: #714b67; stroke: #714b67; }
.k-current { fill: #e6f2f3; stroke: #d0d7de; }
.white { fill: #ffffff; }
.teal { fill: #017e84; }
.bad-text { fill: #d23f3a; font-size: 16px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .bg, .labbg { fill: #1b1f27; }
  text { fill: #e5e7eb; }
  .m { fill: #9ca3af; }
  .lab { fill: #c4c9d0; }
  .arrow { stroke: #9ca3af; } .head { fill: #9ca3af; }
  .arrow.bold { stroke: #3fb6bc; } .head.bold { fill: #3fb6bc; }
  .life { stroke: #4a5060; }
  .k-default { fill: #232834; stroke: #3a3f4d; }
  .k-outside { fill: #3a2f12; stroke: #d9a521; }
  .k-cloud { fill: #12302f; stroke: #3fb6bc; }
  .k-panel { fill: #33222f; stroke: #b58aa8; }
  .k-instance { fill: #222833; stroke: #6b7280; }
  .k-danger { fill: #3b1c1c; stroke: #ef5350; }
  .k-decision { fill: #3a3015; stroke: #f0b429; }
  .k-ok { fill: #17301f; stroke: #4caf50; }
  .k-ui { fill: #232834; stroke: #3a3f4d; }
  .k-button { fill: #3a3f4d; stroke: #3a3f4d; }
  .k-primary { fill: #875a7b; stroke: #875a7b; }
  .k-current { fill: #12302f; stroke: #3a3f4d; }
  .teal { fill: #3fb6bc; }
}
</style><rect class="bg" width="780" height="700" rx="12"/><rect class="k-outside" x="40" y="20" width="470" height="40" rx="8"/><text class="s" x="275.0" y="44.5" text-anchor="middle">Repository, branch, version, edition, lifetime</text><path class="arrow " d="M275.0,60 L275.0,82"/><path class="head " d="M275.0,82 L270.5,73.0 L279.5,73.0 Z"/><rect class="k-decision" x="40" y="82" width="470" height="40" rx="8"/><text class="s" x="275.0" y="106.5" text-anchor="middle">Access check: the repository and every submodule</text><path class="arrow " d="M275.0,122 L275.0,144"/><path class="head " d="M275.0,144 L270.5,135.0 L279.5,135.0 Z"/><rect class="k-default" x="40" y="144" width="470" height="40" rx="8"/><text class="s" x="275.0" y="168.5" text-anchor="middle">Name, database name and three ports reserved</text><path class="arrow " d="M275.0,184 L275.0,206"/><path class="head " d="M275.0,206 L270.5,197.0 L279.5,197.0 Z"/><rect class="k-default" x="40" y="206" width="470" height="40" rx="8"/><text class="s" x="275.0" y="230.5" text-anchor="middle">git clone --recurse-submodules</text><path class="arrow " d="M275.0,246 L275.0,268"/><path class="head " d="M275.0,268 L270.5,259.0 L279.5,259.0 Z"/><rect class="k-default" x="40" y="268" width="470" height="40" rx="8"/><text class="s" x="275.0" y="292.5" text-anchor="middle">.env, odoo.conf (master password hashed), docker-compose.yml</text><path class="arrow " d="M275.0,308 L275.0,330"/><path class="head " d="M275.0,330 L270.5,321.0 L279.5,321.0 Z"/><rect class="k-default" x="40" y="330" width="470" height="40" rx="8"/><text class="s" x="275.0" y="354.5" text-anchor="middle">Download the Odoo image (once per version)</text><path class="arrow " d="M275.0,370 L275.0,392"/><path class="head " d="M275.0,392 L270.5,383.0 L279.5,383.0 Z"/><rect class="k-default" x="40" y="392" width="470" height="40" rx="8"/><text class="s" x="275.0" y="416.5" text-anchor="middle">Start PostgreSQL, create the database (+ web_enterprise)</text><path class="arrow " d="M275.0,432 L275.0,454"/><path class="head " d="M275.0,454 L270.5,445.0 L279.5,445.0 Z"/><rect class="k-default" x="40" y="454" width="470" height="40" rx="8"/><text class="s" x="275.0" y="478.5" text-anchor="middle">Install the repository's own modules (if chosen)</text><path class="arrow " d="M275.0,494 L275.0,516"/><path class="head " d="M275.0,516 L270.5,507.0 L279.5,507.0 Z"/><rect class="k-default" x="40" y="516" width="470" height="40" rx="8"/><text class="s" x="275.0" y="540.5" text-anchor="middle">Gateway and connector, wait for the public address</text><path class="arrow " d="M275.0,556 L275.0,578"/><path class="head " d="M275.0,578 L270.5,569.0 L279.5,569.0 Z"/><rect class="k-default" x="40" y="578" width="470" height="40" rx="8"/><text class="s" x="275.0" y="602.5" text-anchor="middle">Start Odoo, wait until it answers</text><path class="arrow " d="M275.0,618 L275.0,640"/><path class="head " d="M275.0,640 L270.5,631.0 L279.5,631.0 Z"/><rect class="k-ok" x="40" y="640" width="470" height="40" rx="8"/><text class="s" x="275.0" y="664.5" text-anchor="middle">Show the link and the login</text><rect class="k-decision" x="570" y="76" width="190" height="52" rx="8"/><text class="s" x="665.0" y="97.0" text-anchor="middle">Create a deploy key,</text><text class="s" x="665.0" y="116.0" text-anchor="middle">add it on GitHub</text><path class="arrow " d="M510,96 L570,96"/><path class="head " d="M570,96 L561.0,100.5 L561.0,91.5 Z"/><rect class="labbg" x="504.8" y="75" width="70.5" height="18" rx="3"/><text class="lab" x="540.0" y="88.0" text-anchor="middle">no access</text><path class="arrow " d="M665,128 L665,152 L550,152 L550,112 L510,112"/><path class="head " d="M510,112 L519.0,107.5 L519.0,116.5 Z"/><rect class="labbg" x="578.0" y="155" width="83.9" height="18" rx="3"/><text class="lab" x="620.0" y="168.0" text-anchor="middle">check again</text><rect class="k-danger" x="570" y="330" width="190" height="72" rx="8"/><text class="s" x="665.0" y="351.5" text-anchor="middle">Any step fails:</text><text class="s" x="665.0" y="370.5" text-anchor="middle">everything created</text><text class="s" x="665.0" y="389.5" text-anchor="middle">so far is removed</text></svg>
