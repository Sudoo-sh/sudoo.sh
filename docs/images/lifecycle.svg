<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-label="Life of an instance"><title>Life of an instance</title><style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Noto Sans', Arial, sans-serif; fill: #1f2937; }
.t { font-size: 14px; font-weight: 600; }
.s { font-size: 12.5px; }
.m { font-size: 12px; fill: #6b7280; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.lab { font-size: 12px; fill: #4b5563; }
.labbg { fill: #ffffff; }
.arrow { stroke: #6b7280; stroke-width: 1.6; fill: none; }
.arrow.dash { stroke-dasharray: 5 4; }
.arrow.bold { stroke: #017e84; stroke-width: 3; }
.arrow.bad { stroke: #d23f3a; }
.head { fill: #6b7280; }
.head.bold { fill: #017e84; }
.head.bad { fill: #d23f3a; }
.life { stroke: #c4c9d0; stroke-width: 1.2; stroke-dasharray: 4 4; }
.k-default { fill: #ffffff; stroke: #d0d7de; }
.k-outside { fill: #fff8e6; stroke: #d9a521; }
.k-cloud { fill: #e6f2f3; stroke: #017e84; }
.k-panel { fill: #f3edf2; stroke: #714b67; }
.k-instance { fill: #eef2f7; stroke: #8792a2; }
.k-danger { fill: #fdecec; stroke: #d23f3a; }
.k-decision { fill: #fff3cd; stroke: #e99d00; }
.k-ok { fill: #e8f5ec; stroke: #28a745; }
.k-group { fill: none; stroke: #9ca3af; stroke-dasharray: 6 5; }
.k-ui { fill: #f9fafb; stroke: #d0d7de; }
.k-button { fill: #e7e9ed; stroke: #e7e9ed; }
.k-primary { fill: #714b67; stroke: #714b67; }
.k-current { fill: #e6f2f3; stroke: #d0d7de; }
.white { fill: #ffffff; }
.teal { fill: #017e84; }
.bad-text { fill: #d23f3a; font-size: 16px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .bg, .labbg { fill: #1b1f27; }
  text { fill: #e5e7eb; }
  .m { fill: #9ca3af; }
  .lab { fill: #c4c9d0; }
  .arrow { stroke: #9ca3af; } .head { fill: #9ca3af; }
  .arrow.bold { stroke: #3fb6bc; } .head.bold { fill: #3fb6bc; }
  .life { stroke: #4a5060; }
  .k-default { fill: #232834; stroke: #3a3f4d; }
  .k-outside { fill: #3a2f12; stroke: #d9a521; }
  .k-cloud { fill: #12302f; stroke: #3fb6bc; }
  .k-panel { fill: #33222f; stroke: #b58aa8; }
  .k-instance { fill: #222833; stroke: #6b7280; }
  .k-danger { fill: #3b1c1c; stroke: #ef5350; }
  .k-decision { fill: #3a3015; stroke: #f0b429; }
  .k-ok { fill: #17301f; stroke: #4caf50; }
  .k-ui { fill: #232834; stroke: #3a3f4d; }
  .k-button { fill: #3a3f4d; stroke: #3a3f4d; }
  .k-primary { fill: #875a7b; stroke: #875a7b; }
  .k-current { fill: #12302f; stroke: #3a3f4d; }
  .teal { fill: #3fb6bc; }
}
</style><rect class="bg" width="780" height="420" rx="12"/><circle class="teal" cx="40" cy="70" r="8"/><path class="arrow " d="M48,70 L88,70"/><path class="head " d="M88,70 L79.0,74.5 L79.0,65.5 Z"/><rect class="k-default" x="90" y="44" width="130" height="52" rx="8"/><text class="t" x="155.0" y="74.5" text-anchor="middle">Creating</text><rect class="k-ok" x="300" y="160" width="150" height="60" rx="8"/><text class="t" x="375.0" y="185.0" text-anchor="middle">Running</text><text class="s" x="375.0" y="204.0" text-anchor="middle">restart, updates</text><rect class="k-instance" x="580" y="160" width="150" height="60" rx="8"/><text class="t" x="655.0" y="185.0" text-anchor="middle">Paused</text><text class="s" x="655.0" y="204.0" text-anchor="middle">uses no memory</text><rect class="k-instance" x="300" y="320" width="150" height="60" rx="8"/><text class="t" x="375.0" y="345.0" text-anchor="middle">Switched off</text><text class="s" x="375.0" y="364.0" text-anchor="middle">does not wake up</text><rect class="k-danger" x="90" y="320" width="130" height="60" rx="8"/><text class="t" x="155.0" y="345.0" text-anchor="middle">Deleted</text><text class="s" x="155.0" y="364.0" text-anchor="middle">backup kept</text><path class="arrow " d="M220,70 L375,70 L375,160"/><path class="head " d="M375,160 L370.5,151.0 L379.5,151.0 Z"/><rect class="labbg" x="278.2" y="49" width="43.6" height="18" rx="3"/><text class="lab" x="300.0" y="62.0" text-anchor="middle">ready</text><path class="arrow " d="M155,96 L155,320"/><path class="head " d="M155,320 L150.5,311.0 L159.5,311.0 Z"/><rect class="labbg" x="86.2" y="197" width="137.7" height="18" rx="3"/><text class="lab" x="155.0" y="210.0" text-anchor="middle">failed: all removed</text><path class="arrow " d="M450,180 L580,180"/><path class="head " d="M580,180 L571.0,184.5 L571.0,175.5 Z"/><rect class="labbg" x="442.8" y="157" width="144.4" height="18" rx="3"/><text class="lab" x="515.0" y="170.0" text-anchor="middle">6 h unused, or Pause</text><path class="arrow " d="M580,204 L450,204"/><path class="head " d="M450,204 L459.0,199.5 L459.0,208.5 Z"/><rect class="labbg" x="442.8" y="209" width="144.4" height="18" rx="3"/><text class="lab" x="515.0" y="222.0" text-anchor="middle">visit, Start, update</text><path class="arrow " d="M360,220 L360,320"/><path class="head " d="M360,320 L355.5,311.0 L364.5,311.0 Z"/><rect class="labbg" x="272.8" y="261" width="77.2" height="18" rx="3"/><text class="lab" x="345.0" y="274.0" text-anchor="end">Switch off</text><path class="arrow " d="M390,320 L390,220"/><path class="head " d="M390,220 L394.5,229.0 L385.5,229.0 Z"/><rect class="labbg" x="400.0" y="261" width="70.5" height="18" rx="3"/><text class="lab" x="405.0" y="274.0" text-anchor="start">Switch on</text><path class="arrow " d="M655,220 L655,350 L450,350"/><path class="head " d="M450,350 L459.0,345.5 L459.0,354.5 Z"/><rect class="labbg" x="561.4" y="329" width="77.2" height="18" rx="3"/><text class="lab" x="600.0" y="342.0" text-anchor="middle">Switch off</text><path class="arrow " d="M300,350 L220,350"/><path class="head " d="M220,350 L229.0,345.5 L229.0,354.5 Z"/><rect class="labbg" x="234.8" y="329" width="50.3" height="18" rx="3"/><text class="lab" x="260.0" y="342.0" text-anchor="middle">Delete</text><text class="m" x="390.0" y="408.0" text-anchor="middle">Delete, or the end of the instance's lifetime, works from every state; a backup is taken first.</text></svg>
