<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190" role="img" aria-label="How a panel password is stored"><title>How a panel password is stored</title><style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Noto Sans', Arial, sans-serif; fill: #1f2937; }
.t { font-size: 14px; font-weight: 600; }
.s { font-size: 12.5px; }
.m { font-size: 12px; fill: #6b7280; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.lab { font-size: 12px; fill: #4b5563; }
.labbg { fill: #ffffff; }
.arrow { stroke: #6b7280; stroke-width: 1.6; fill: none; }
.arrow.dash { stroke-dasharray: 5 4; }
.arrow.bold { stroke: #017e84; stroke-width: 3; }
.arrow.bad { stroke: #d23f3a; }
.head { fill: #6b7280; }
.head.bold { fill: #017e84; }
.head.bad { fill: #d23f3a; }
.life { stroke: #c4c9d0; stroke-width: 1.2; stroke-dasharray: 4 4; }
.k-default { fill: #ffffff; stroke: #d0d7de; }
.k-outside { fill: #fff8e6; stroke: #d9a521; }
.k-cloud { fill: #e6f2f3; stroke: #017e84; }
.k-panel { fill: #f3edf2; stroke: #714b67; }
.k-instance { fill: #eef2f7; stroke: #8792a2; }
.k-danger { fill: #fdecec; stroke: #d23f3a; }
.k-decision { fill: #fff3cd; stroke: #e99d00; }
.k-ok { fill: #e8f5ec; stroke: #28a745; }
.k-group { fill: none; stroke: #9ca3af; stroke-dasharray: 6 5; }
.k-ui { fill: #f9fafb; stroke: #d0d7de; }
.k-button { fill: #e7e9ed; stroke: #e7e9ed; }
.k-primary { fill: #714b67; stroke: #714b67; }
.k-current { fill: #e6f2f3; stroke: #d0d7de; }
.white { fill: #ffffff; }
.teal { fill: #017e84; }
.bad-text { fill: #d23f3a; font-size: 16px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .bg, .labbg { fill: #1b1f27; }
  text { fill: #e5e7eb; }
  .m { fill: #9ca3af; }
  .lab { fill: #c4c9d0; }
  .arrow { stroke: #9ca3af; } .head { fill: #9ca3af; }
  .arrow.bold { stroke: #3fb6bc; } .head.bold { fill: #3fb6bc; }
  .life { stroke: #4a5060; }
  .k-default { fill: #232834; stroke: #3a3f4d; }
  .k-outside { fill: #3a2f12; stroke: #d9a521; }
  .k-cloud { fill: #12302f; stroke: #3fb6bc; }
  .k-panel { fill: #33222f; stroke: #b58aa8; }
  .k-instance { fill: #222833; stroke: #6b7280; }
  .k-danger { fill: #3b1c1c; stroke: #ef5350; }
  .k-decision { fill: #3a3015; stroke: #f0b429; }
  .k-ok { fill: #17301f; stroke: #4caf50; }
  .k-ui { fill: #232834; stroke: #3a3f4d; }
  .k-button { fill: #3a3f4d; stroke: #3a3f4d; }
  .k-primary { fill: #875a7b; stroke: #875a7b; }
  .k-current { fill: #12302f; stroke: #3a3f4d; }
  .teal { fill: #3fb6bc; }
}
</style><rect class="bg" width="860" height="190" rx="12"/><rect class="k-outside" x="20" y="40" width="180" height="64" rx="8"/><text class="t" x="110.0" y="67.0" text-anchor="middle">Password</text><text class="s" x="110.0" y="86.0" text-anchor="middle">typed at sign-in</text><path class="arrow " d="M200,72 L240,72"/><path class="head " d="M240,72 L231.0,76.5 L231.0,67.5 Z"/><rect class="k-panel" x="240" y="40" width="180" height="64" rx="8"/><text class="t" x="330.0" y="67.0" text-anchor="middle">HMAC with the pepper</text><text class="s" x="330.0" y="86.0" text-anchor="middle">key from vault.key</text><path class="arrow " d="M420,72 L460,72"/><path class="head " d="M460,72 L451.0,76.5 L451.0,67.5 Z"/><rect class="k-panel" x="460" y="40" width="180" height="64" rx="8"/><text class="t" x="550.0" y="67.0" text-anchor="middle">scrypt with a salt</text><text class="s" x="550.0" y="86.0" text-anchor="middle">slow and memory-hungry</text><path class="arrow " d="M640,72 L680,72"/><path class="head " d="M680,72 L671.0,76.5 L671.0,67.5 Z"/><rect class="k-ok" x="680" y="40" width="180" height="64" rx="8"/><text class="t" x="770.0" y="67.0" text-anchor="middle">Stored hash</text><text class="s" x="770.0" y="86.0" text-anchor="middle">in sudoo.db</text><text class="m" x="430.0" y="150.0" text-anchor="middle">One-way: the password cannot be calculated back from the stored hash.</text><text class="m" x="430.0" y="172.0" text-anchor="middle">Without vault.key, a copy of the database cannot even be attacked.</text></svg>
