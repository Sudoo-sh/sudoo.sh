<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="How a tunnel works"><title>How a tunnel works</title><style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Noto Sans', Arial, sans-serif; fill: #1f2937; }
.t { font-size: 14px; font-weight: 600; }
.s { font-size: 12.5px; }
.m { font-size: 12px; fill: #6b7280; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.lab { font-size: 12px; fill: #4b5563; }
.labbg { fill: #ffffff; }
.arrow { stroke: #6b7280; stroke-width: 1.6; fill: none; }
.arrow.dash { stroke-dasharray: 5 4; }
.arrow.bold { stroke: #017e84; stroke-width: 3; }
.arrow.bad { stroke: #d23f3a; }
.head { fill: #6b7280; }
.head.bold { fill: #017e84; }
.head.bad { fill: #d23f3a; }
.life { stroke: #c4c9d0; stroke-width: 1.2; stroke-dasharray: 4 4; }
.k-default { fill: #ffffff; stroke: #d0d7de; }
.k-outside { fill: #fff8e6; stroke: #d9a521; }
.k-cloud { fill: #e6f2f3; stroke: #017e84; }
.k-panel { fill: #f3edf2; stroke: #714b67; }
.k-instance { fill: #eef2f7; stroke: #8792a2; }
.k-danger { fill: #fdecec; stroke: #d23f3a; }
.k-decision { fill: #fff3cd; stroke: #e99d00; }
.k-ok { fill: #e8f5ec; stroke: #28a745; }
.k-group { fill: none; stroke: #9ca3af; stroke-dasharray: 6 5; }
.k-ui { fill: #f9fafb; stroke: #d0d7de; }
.k-button { fill: #e7e9ed; stroke: #e7e9ed; }
.k-primary { fill: #714b67; stroke: #714b67; }
.k-current { fill: #e6f2f3; stroke: #d0d7de; }
.white { fill: #ffffff; }
.teal { fill: #017e84; }
.bad-text { fill: #d23f3a; font-size: 16px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .bg, .labbg { fill: #1b1f27; }
  text { fill: #e5e7eb; }
  .m { fill: #9ca3af; }
  .lab { fill: #c4c9d0; }
  .arrow { stroke: #9ca3af; } .head { fill: #9ca3af; }
  .arrow.bold { stroke: #3fb6bc; } .head.bold { fill: #3fb6bc; }
  .life { stroke: #4a5060; }
  .k-default { fill: #232834; stroke: #3a3f4d; }
  .k-outside { fill: #3a2f12; stroke: #d9a521; }
  .k-cloud { fill: #12302f; stroke: #3fb6bc; }
  .k-panel { fill: #33222f; stroke: #b58aa8; }
  .k-instance { fill: #222833; stroke: #6b7280; }
  .k-danger { fill: #3b1c1c; stroke: #ef5350; }
  .k-decision { fill: #3a3015; stroke: #f0b429; }
  .k-ok { fill: #17301f; stroke: #4caf50; }
  .k-ui { fill: #232834; stroke: #3a3f4d; }
  .k-button { fill: #3a3f4d; stroke: #3a3f4d; }
  .k-primary { fill: #875a7b; stroke: #875a7b; }
  .k-current { fill: #12302f; stroke: #3a3f4d; }
  .teal { fill: #3fb6bc; }
}
</style><rect class="bg" width="860" height="330" rx="12"/><text class="t" x="20.0" y="30.0" text-anchor="start">1. The connector on our server calls OUT to Cloudflare and keeps the line open</text><rect class="k-instance" x="20" y="50" width="220" height="60" rx="8"/><text class="t" x="130.0" y="75.0" text-anchor="middle">Our server</text><text class="s" x="130.0" y="94.0" text-anchor="middle">connector (cloudflared)</text><rect class="k-cloud" x="600" y="50" width="240" height="60" rx="8"/><text class="t" x="720.0" y="75.0" text-anchor="middle">Cloudflare</text><text class="s" x="720.0" y="94.0" text-anchor="middle">gives the line a public address</text><path class="arrow bold" d="M240,80 L600,80"/><path class="head bold" d="M600,80 L589.0,85.5 L589.0,74.5 Z"/><rect class="labbg" x="320.9" y="57" width="198.2" height="18" rx="3"/><text class="lab" x="420.0" y="70.0" text-anchor="middle">outgoing connection: allowed</text><text class="t" x="20.0" y="170.0" text-anchor="start">2. Visitors use the address; Cloudflare sends them down the open line</text><rect class="k-outside" x="20" y="190" width="140" height="60" rx="8"/><text class="t" x="90.0" y="215.0" text-anchor="middle">Visitor</text><text class="s" x="90.0" y="234.0" text-anchor="middle">opens the link</text><rect class="k-cloud" x="240" y="190" width="170" height="60" rx="8"/><text class="t" x="325.0" y="224.5" text-anchor="middle">Cloudflare</text><rect class="k-instance" x="490" y="190" width="150" height="60" rx="8"/><text class="t" x="565.0" y="224.5" text-anchor="middle">Connector</text><rect class="k-panel" x="700" y="190" width="140" height="60" rx="8"/><text class="t" x="770.0" y="215.0" text-anchor="middle">Our program</text><text class="s" x="770.0" y="234.0" text-anchor="middle">on 127.0.0.1</text><path class="arrow " d="M160,212 L240,212"/><path class="head " d="M240,212 L231.0,216.5 L231.0,207.5 Z"/><path class="arrow bold" d="M410,212 L490,212"/><path class="head bold" d="M490,212 L479.0,217.5 L479.0,206.5 Z"/><path class="arrow " d="M640,212 L700,212"/><path class="head " d="M700,212 L691.0,216.5 L691.0,207.5 Z"/><path class="arrow dash" d="M700,232 L640,232"/><path class="head dash" d="M640,232 L649.0,227.5 L649.0,236.5 Z"/><path class="arrow dash bold" d="M490,232 L410,232"/><path class="head dash bold" d="M410,232 L421.0,226.5 L421.0,237.5 Z"/><path class="arrow dash" d="M240,232 L160,232"/><path class="head dash" d="M160,232 L169.0,227.5 L169.0,236.5 Z"/><text class="m" x="430.0" y="300.0" text-anchor="middle">The visit travels inside a connection the server started, so nothing has to be opened on the server or the provider.</text></svg>
