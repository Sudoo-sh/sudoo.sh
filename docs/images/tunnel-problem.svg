</style><rect class="bg" width="860" height="300" rx="12"/><rect class="k-outside" x="20" y="70" width="150" height="160" rx="8"/><text class="t" x="95.0" y="145.0" text-anchor="middle">Internet</text><text class="s" x="95.0" y="164.0" text-anchor="middle">anyone, anywhere</text><rect class="k-default" x="300" y="40" width="230" height="220" rx="8"/><text class="t" x="415.0" y="135.5" text-anchor="middle">Provider's machine</text><text class="s" x="415.0" y="154.5" text-anchor="middle">public address</text><text class="s" x="415.0" y="173.5" text-anchor="middle">203.0.113.10</text><rect class="k-instance" x="660" y="40" width="180" height="220" rx="8"/><text class="t" x="750.0" y="126.0" text-anchor="middle">Our server</text><text class="s" x="750.0" y="145.0" text-anchor="middle">a container,</text><text class="s" x="750.0" y="164.0" text-anchor="middle">private address</text><text class="s" x="750.0" y="183.0" text-anchor="middle">10.x.x.x</text><path class="arrow bold" d="M170,110 L660,110"/><path class="head bold" d="M660,110 L649.0,115.5 L649.0,104.5 Z"/><rect class="labbg" x="312.6" y="87" width="204.9" height="18" rx="3"/><text class="lab" x="415.0" y="100.0" text-anchor="middle">ssh -p 2222: forwarded to SSH</text><path class="arrow bad" d="M170,200 L380,200"/><path class="head bad" d="M380,200 L371.0,204.5 L371.0,195.5 Z"/><rect class="labbg" x="189.5" y="177" width="131.0" height="18" rx="3"/><text class="lab" x="255.0" y="190.0" text-anchor="middle">https on port 9000</text><text class="bad-text" x="398.0" y="206.0" text-anchor="middle">✗</text><text class="lab" x="470.0" y="206.0" text-anchor="middle">dropped</text><text class="m" x="430.0" y="284.0" text-anchor="middle">Only the SSH port is forwarded. The provider will not forward more, so a web panel on the server cannot be opened directly.</text></svg>
