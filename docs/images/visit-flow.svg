4 L628,54"/><path class="head " d="M628,54 L619.0,58.5 L619.0,49.5 Z"/><path class="arrow dash" d="M628,70 L594,70"/><path class="head dash" d="M594,70 L603.0,65.5 L603.0,74.5 Z"/><rect class="labbg" x="555.6" y="11" width="110.8" height="18" rx="3"/><text class="lab" x="611.0" y="24.0" text-anchor="middle">127.0.0.1:28070</text><rect class="k-instance" x="628" y="30" width="118" height="60" rx="8"/><text class="t" x="687.0" y="55.0" text-anchor="middle">Odoo</text><text class="s" x="687.0" y="74.0" text-anchor="middle">port 28070</text><path class="arrow " d="M746,54 L780,54"/><path class="head " d="M780,54 L771.0,58.5 L771.0,49.5 Z"/><path class="arrow dash" d="M780,70 L746,70"/><path class="head dash" d="M746,70 L755.0,65.5 L755.0,74.5 Z"/><rect class="labbg" x="747.9" y="11" width="30.2" height="18" rx="3"/><text class="lab" x="763.0" y="24.0" text-anchor="middle">SQL</text><rect class="k-instance" x="780" y="30" width="118" height="60" rx="8"/><text class="t" x="839.0" y="55.0" text-anchor="middle">PostgreSQL</text><text class="s" x="839.0" y="74.0" text-anchor="middle">database</text><path class="arrow " d="M535.0,90 L535.0,120"/><rect class="k-panel" x="386" y="120" width="298" height="96" rx="8"/><text class="s" x="400.0" y="144.0" text-anchor="start">records the visit (for automatic pause)</text><text class="s" x="400.0" y="163.0" text-anchor="start">removes the panel's cookie</text><text class="s" x="400.0" y="182.0" text-anchor="start">passes on X-Forwarded-For and https</text><text class="s" x="400.0" y="201.0" text-anchor="start">starts a paused instance</text><text class="m" x="20.0" y="236.0" text-anchor="start">Solid arrows: the request. Dashed arrows: the answer, streamed back the same way.</text></svg>
