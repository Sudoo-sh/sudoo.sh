[project]
name = "instance-manager"
version = "0.2.0"
description = "Web panel that runs many independent Odoo instances on one Docker server, from any Git branch."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Yousef M. Y. Al Sabbah" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Flask",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "aiohttp>=3.10",
    "cryptography>=43",
    "flask>=3.0",
    "gunicorn>=23.0",
    "markdown>=3.7",
    "pydantic-settings>=2.6",
]

[project.urls]
Repository = "https://github.com/Yosef-AlSabbah/odoo-instance-manager"
Documentation = "https://github.com/Yosef-AlSabbah/odoo-instance-manager/tree/main/docs"

[project.scripts]
instance-manager = "instance_manager.cli:main"

# ---------------------------------------------------------------- plugins (see docs/PLUGINS.md)
[project.entry-points."instance_manager.exposure"]
cloudflare-quick = "instance_manager.exposure.cloudflare:CloudflareQuickTunnel"
host-ports = "instance_manager.exposure.ports:HostPorts"

[project.entry-points."instance_manager.addon_sources"]
folder = "instance_manager.addons.folder:FolderSource"
git = "instance_manager.addons.git:GitSource"

[project.entry-points."instance_manager.update_triggers"]
polling = "instance_manager.triggers.polling:Polling"
github-webhook = "instance_manager.triggers.github_webhook:GitHubWebhook"

[dependency-groups]
dev = [
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-markdown",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instance_manager"]

# ---------------------------------------------------------------- code style and checks
[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern syntax, simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]  # black decides line length

[tool.ruff.lint.isort]
known-first-party = ["instance_manager"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
