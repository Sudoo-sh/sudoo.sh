<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in - Sudoo.sh</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/js/login.js" defer></script>
</head>
<body>
<div class="login-wrap">
  <main class="login">
    <div class="brand"><img class="brand-mark" src="/static/odoo-icon.svg" alt=""><span>Sudoo.sh</span></div>
    <form class="box" id="login-form" autocomplete="on">
      <div class="box-body">
        <h1>Sign in</h1>
        <label class="field" for="username">User name</label>
        <input class="input" id="username" name="username" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label class="field" for="password">Password</label>
        <input class="input" id="password" name="password" maxlength="128" type="password" autocomplete="current-password" required>
        <div class="callout error" id="login-error" role="alert" hidden></div>
        <button class="btn primary" id="login-submit" type="submit">Sign in</button>
      </div>
    </form>
    <p class="login-foot" id="login-contact">Forgot your password? Contact the administrator.</p>
    <p class="login-foot">Sudoo.sh. Created by Yousef M. Y. Al Sabbah.</p>
  </main>
</div>
</body>
</html>
